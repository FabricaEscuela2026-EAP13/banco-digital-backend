apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: bancodigital-monitor
  namespace: monitoring
spec:
  selector:
    matchLabels:
      app: bancodigital
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 15s
  namespaceSelector:
    matchNames:
      - default
